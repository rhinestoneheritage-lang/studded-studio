function generateShapePoints(kind, x, y, w, h) {
  const cx = x + w / 2, cy = y + h / 2;
  const rx = w / 2, ry = h / 2;
  const pts = [];
  const poly = (n, rot = -Math.PI / 2) => {
    for (let i = 0; i < n; i++) {
      const a = rot + (i * 2 * Math.PI) / n;
      pts.push({ x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) });
    }
  };
  switch (kind) {
    case "rect":
    case "square":
      pts.push({ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h });
      break;
    case "circle":
    case "ellipse": {
      const n = 48;
      for (let i = 0; i < n; i++) {
        const a = (i * 2 * Math.PI) / n;
        pts.push({ x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) });
      }
      break;
    }
    case "triangle":
      pts.push({ x: cx, y }, { x: x + w, y: y + h }, { x, y: y + h });
      break;
    case "diamond":
      pts.push({ x: cx, y }, { x: x + w, y: cy }, { x: cx, y: y + h }, { x, y: cy });
      break;
    case "pentagon":
      poly(5);
      break;
    case "hexagon":
      poly(6);
      break;
    case "star": {
      const spikes = 5;
      const outerX = rx, outerY = ry, innerX = rx * 0.44, innerY = ry * 0.44;
      let rot = -Math.PI / 2;
      for (let i = 0; i < spikes * 2; i++) {
        const a = rot + (i * Math.PI) / spikes;
        const ox = i % 2 === 0 ? outerX : innerX;
        const oy = i % 2 === 0 ? outerY : innerY;
        pts.push({ x: cx + ox * Math.cos(a), y: cy + oy * Math.sin(a) });
      }
      break;
    }
    case "heart": {
      const n = 60;
      for (let i = 0; i < n; i++) {
        const t = (i / n) * 2 * Math.PI;
        // parametric heart, normalized to bbox
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        pts.push({ x: cx + (hx / 17) * rx, y: cy - (hy / 17) * ry });
      }
      break;
    }
    default:
      pts.push({ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h });
  }
  return pts;
}

// Preflight: finds overlaps, duplicates, too-close pairs, isolated stones and stones outside the canvas
function ssPreflight(stones, minGapMm) {
  const CELL = 40; // px (= 10 mm)

  stones.forEach((st, i) => {
    const key = Math.floor(st.x / CELL) + "," + Math.floor(st.y / CELL);

  });

  let overlapPairs = 0, worstGap = Infinity;
  stones.forEach((a, i) => {
    const r = (a.mm * PX_PER_MM) / 2;
    if (a.x - r < 0 || a.y - r < 0 || a.x + r > CANVAS_W || a.y + r > CANVAS_H) outside.add(a.id);
    const cx = Math.floor(a.x / CELL), cy = Math.floor(a.y / CELL);
    let nearest = Infinity;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const list = grid.get((cx + dx) + "," + (cy + dy)); if (!list) continue;
      for (const j of list) {
        if (j === i) continue;

        const distMm = Math.hypot(a.x - b.x, a.y - b.y) / PX_PER_MM;
        const gap = distMm - (a.mm + b.mm) / 2;
        if (gap < nearest) nearest = gap;
        if (j < i) continue; // count each pair once
        if (gap < worstGap) worstGap = gap;
        if (distMm < 0.25) { duplicate.add(a.id); duplicate.add(b.id); overlapPairs++; }
        else if (gap < -Math.max(0.05, 0.03 * (a.mm + b.mm) / 2)) { overlap.add(a.id); overlap.add(b.id); overlapPairs++; } // 3% tolerance = Auto-Fix ka 'just touching'
        else if (gap < minGapMm) { close.add(a.id); close.add(b.id); }
      }

    if (stones.length > 1 && nearest > 5) isolated.add(a.id);
  });

  const [autoDesignCount, setAutoDesignCount] = useState(3); // how many sizes for one-click Auto Design
  // Design fill presets: each = ordered list of {ss, colorName} applied thin→thick by stroke thickness
  const [designPresets, setDesignPresets] = useState([
    { id: "dp1", name: "Crystal Mix (3 size)", combo: [ { ss: "SS6", color: "Crystal" }, { ss: "SS10", color: "Crystal" }, { ss: "SS16", color: "Crystal AB" } ] },
    { id: "dp2", name: "Gold + Ruby", combo: [ { ss: "SS6", color: "Gold" }, { ss: "SS10", color: "Ruby" }, { ss: "SS16", color: "Gold" } ] },
    { id: "dp3", name: "Black Outline + Silver", combo: [ { ss: "SS6", color: "Silver" }, { ss: "SS16", color: "Jet Black" } ] },
  ]);
  const [selectedDesignPreset, setSelectedDesignPreset] = useState("dp1");
  const [presetBuilder, setPresetBuilder] = useState([ { ss: "SS4", color: "Crystal" }, { ss: "SS4", color: "Ruby" }, { ss: "SS6", color: "Gold" } ]);
  const [lockAspect, setLockAspect] = useState(true); // lock W/H proportion when resizing shape
  const shapeDragRef = useRef(null); // {startX, startY, origX, origY}

  // ---- TRW-style Fill panel settings ----
  const [fillPanel, setFillPanel] = useState({
    side: "inside",        // 'inside' | 'outside'
    addStones: false,      // add to existing vs replace
    magicPath: false,
    islands: 0,            // number of inner island rings
    space: 0.1,            // general spacing factor
    fillLinesSpacing: 2.69,// mm between fill lines
    contourSpacing: 2.79,  // mm between contour offsets
    hatchAngle: 0,         // degrees
    cornerDetect: true,
    cornerAngle: 100,      // degrees
    decreaseCountBy: 0,
    fadeBy: 0,
    scatterMode: "contour",// 'contour' | 'box' | 'ellipse'
    density: 0,
  });
  const setFP = (key, value) => setFillPanel((p) => ({ ...p, [key]: value }));

  // ---- Setting presets (save spacing/size/fill config, apply with one click) ----
  const [presets, setPresets] = useState([]);
  const [presetName, setPresetName] = useState("");
  const [selectedPresetId, setSelectedPresetId] = useState("");

  const saveCurrentPreset = () => {
    const name = presetName.trim() || `Preset ${presets.length + 1}`;
    const data = {
      activeSS, activeColor, spacing, fillPanel: { ...fillPanel },
    };
    const preset = { id: `p${Date.now()}`, name, data };
    setPresets((prev) => [...prev, preset]);
    setSelectedPresetId(preset.id);
    setPresetName("");
  };

  const applyPreset = (id) => {
    const preset = presets.find((p) => p.id === id);
    if (!preset) return;
    const d = preset.data;
    if (d.activeSS) setActiveSS(d.activeSS);
    if (d.activeColor) setActiveColor(d.activeColor);
    if (typeof d.spacing === "number") setSpacing(d.spacing);
    if (d.fillPanel) setFillPanel({ ...d.fillPanel });
  };

  const deletePreset = (id) => {
    setPresets((prev) => prev.filter((p) => p.id !== id));
    if (selectedPresetId === id) setSelectedPresetId("");
  };

  // Dispatcher for the TRW fill buttons.
  const runFill = (type) => {
    if (type === "island") { runIslandFill(); return; }
    if (type === "path") { runPathFill(); return; }
    if (type === "offset") { runOffsetFill(); return; }
    if (type === "hatch") { runHatchFill(); return; }
    const labels = { singleline: "Single Line", break: "Break Stones" };
    alert(`${labels[type] || type} — ye function abhi wire karna baaki hai. Iska exact behaviour batao, main isi button pe laga dunga.`);
  };

  // Remember the last fill's stones so switching to another fill replaces them live
  const lastFillRef = useRef(null); // { source, ids }
  const fillSourceRef = useRef(0);  // token identifying the current fill source (image/path)
  const [liveFill, setLiveFill] = useState(true); // replace previous fill when switching fill type

  const svgRef = useRef(null);
  const measureCanvasRef = useRef(document.createElement("canvas"));

  const activeSizeObj = stoneSizes.find((s) => s.ss === activeSS);

  const historyRef = useRef([{ stones: [], paths: [] }]);
  const pushHistory = useCallback((next) => {
    setHistory((h) => {
      const trimmed = h.slice(0, historyIdxRef.current + 1);
      const updated = [...trimmed, next];
      historyRef.current = updated;
      historyIdxRef.current = updated.length - 1;
      setHistoryIdx(updated.length - 1);
      return updated;
    });
  }, []);

  // refs always hold the latest stones/paths so history snapshots are never stale
  const stonesRef = useRef([]);
  const pathsRef = useRef([]);
  const setStones = useCallback((u) => {
    _setStones((prev) => { const n = typeof u === "function" ? u(prev) : u; stonesRef.current = n; return n; });
  }, []);
  const setPaths = useCallback((u) => {
    _setPaths((prev) => { const n = typeof u === "function" ? u(prev) : u; pathsRef.current = n; return n; });
  }, []);

  // Snapshot the WHOLE design (stones + paths) into history
  const snapshotDesign = useCallback(() => {
    pushHistory({ stones: stonesRef.current, paths: pathsRef.current });
  }, [pushHistory]);

  const commitStones = useCallback((next) => {
    stonesRef.current = next;
    _setStones(next);
    pushHistory({ stones: next, paths: pathsRef.current });
  }, [pushHistory]);

  // Commit path changes to history too (shapes, fills that add rings, deletes, transforms)
  const commitPaths = useCallback((nextPaths) => {
    pathsRef.current = nextPaths;
    _setPaths(nextPaths);
    pushHistory({ stones: stonesRef.current, paths: nextPaths });
  }, [pushHistory]);

  // Commit BOTH stones and paths in one history step (delete, clear, load, center)
  const commitDesign = useCallback((nextStones, nextPaths) => {
    stonesRef.current = nextStones; pathsRef.current = nextPaths;
    _setStones(nextStones); _setPaths(nextPaths);
    pushHistory({ stones: nextStones, paths: nextPaths });
  }, [pushHistory]);

  const restoreSnapshot = (snap) => {
    if (!snap) return;
    const s = Array.isArray(snap) ? snap : (snap.stones || []);
    const p = Array.isArray(snap) ? pathsRef.current : (snap.paths || []);
    stonesRef.current = s; pathsRef.current = p;
    _setStones(s); _setPaths(p);
    setSelectedIds([]); setSelectedPathId(null);
    setBlingPreview(null);
  };

  const undo = () => {
    if (historyIdxRef.current > 0) {
      const idx = historyIdxRef.current - 1;
      historyIdxRef.current = idx;
      setHistoryIdx(idx);
      restoreSnapshot(historyRef.current[idx]);
    }
  };
  const redo = () => {
    if (historyIdxRef.current < historyRef.current.length - 1) {
      const idx = historyIdxRef.current + 1;
      historyIdxRef.current = idx;
      setHistoryIdx(idx);
      restoreSnapshot(historyRef.current[idx]);
    }
  };
  const jumpToHistory = (idx) => {
    if (idx < 0 || idx >= historyRef.current.length) return;
    historyIdxRef.current = idx;
    setHistoryIdx(idx);
    restoreSnapshot(historyRef.current[idx]);
  };

  // Keyboard shortcuts: Ctrl/Cmd+Z undo, Ctrl+Y or Ctrl+Shift+Z redo, Delete/Backspace to delete selection
  useEffect(() => {
    const onKey = (e) => {
      const t = e.target;
      const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
      if (typing) return;
      const mod = e.ctrlKey || e.metaKey;
      if (mod && (e.key === "z" || e.key === "Z")) {
        e.preventDefault();
        if (e.shiftKey) redo(); else undo();
      } else if (mod && (e.key === "y" || e.key === "Y")) {
        e.preventDefault();
        redo();
      } else if (mod && (e.key === "d" || e.key === "D")) {
        e.preventDefault();
        duplicateSelection();
      } else if (mod && (e.key === "a" || e.key === "A")) {
        e.preventDefault();
        setSelectedIds(stones.filter((st) => !hiddenSet.has(st.id) && !lockedSet.has(st.id)).map((st) => st.id));
        setTool("select");
      } else if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown") {
        if (selectedIds.length > 0) {
          e.preventDefault();
          const step = e.shiftKey ? 5 : 1; // mm
          const dx = e.key === "ArrowLeft" ? -step : e.key === "ArrowRight" ? step : 0;
          const dy = e.key === "ArrowUp" ? -step : e.key === "ArrowDown" ? step : 0;
          nudgeSelection(dx, dy);
        }
      } else if (e.key === "0" || e.key === "Home") {
        e.preventDefault();
        zoomReset();
      } else if (e.key === "F5") {
        e.preventDefault();
        centerOnDesign();
      } else if (e.key === "Delete" || e.key === "Backspace") {
        e.preventDefault();
        deleteSelection();
      } else if (e.key === "Escape") {
        setSelectedPathId(null);
        setSelectedIds([]);
      } else if (mod && (e.key === "e" || e.key === "E")) {
        e.preventDefault();
        exportPDF();
      } else if (!mod && (e.key === "v" || e.key === "V")) {
        setTool("select");
      } else if (!mod && (e.key === "p" || e.key === "P")) {
        setTool("path"); setDrawingPoints([]);
      } else if (!mod && (e.key === "n" || e.key === "N")) {
        setTool("nodeEdit");
      } else if (!mod && (e.key === "k" || e.key === "K")) {
        setTool("knife");
      } else if (!mod && (e.key === "t" || e.key === "T")) {
        setTool("text"); setShowTextPanel(true);
      } else if (!mod && (e.key === "h" || e.key === "H")) {
        setTool("pan");
      } else if (!mod && (e.key === "g" || e.key === "G")) {
        setTool("stone");
      } else if (!mod && (e.key === "e" || e.key === "E")) {
        setTool("erase");
      } else if (!mod && (e.key === "f" || e.key === "F")) {
        if (placedShapeRef.current) fillShapeWithStones();
      } else if (!mod && (e.key === "r" || e.key === "R")) {
        if (lastActionRef.current) lastActionRef.current.fn();
      } else if (!mod && /^[1-9]$/.test(e.key)) {
        const idx = parseInt(e.key, 10) - 1;
        const sorted = [...stoneSizes].sort((a, b) => a.mm - b.mm);
        if (sorted[idx]) setActiveSS(sorted[idx].ss);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const getSvgPoint = (e) => {
    const svg = svgRef.current;
    const rect = svg.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const viewW = CANVAS_W / zoom;
    const viewH = CANVAS_H / zoom;
    return {
      x: pan.x + ((clientX - rect.left) / rect.width) * viewW,
      y: pan.y + ((clientY - rect.top) / rect.height) * viewH,
    };
  };

  // ---- Zoom / pan ----
  const clampPan = (nx, ny, z) => {
    const viewW = CANVAS_W / z;
    const viewH = CANVAS_H / z;
    return {
      x: Math.max(0, Math.min(nx, CANVAS_W - viewW)),
      y: Math.max(0, Math.min(ny, CANVAS_H - viewH)),
    };
  };

  const applyZoom = (newZoom, centerX, centerY) => {
    const z = Math.max(0.1, Math.min(newZoom, 20)); // allow zooming out to 10% so the whole 40" canvas can be seen at once
    // keep the point (centerX,centerY) under the cursor stable
    const viewW = CANVAS_W / z;
    const viewH = CANVAS_H / z;
    let nx = centerX - viewW / 2;
    let ny = centerY - viewH / 2;
    const clamped = clampPan(nx, ny, z);
    setZoom(z);
    setPan(clamped);
  };

  const zoomIn = () => applyZoom(zoom * 1.4, pan.x + CANVAS_W / zoom / 2, pan.y + CANVAS_H / zoom / 2);
  const zoomOut = () => applyZoom(zoom / 1.4, pan.x + CANVAS_W / zoom / 2, pan.y + CANVAS_H / zoom / 2);
  const zoomReset = () => { setZoom(1); setPan({ x: 0, y: 0 }); };

  // F5: fit + center the current design (stones + vector paths) in the middle of the view —
  // unlike zoomReset (which just goes back to the canvas's top-left corner at 100%).
  const centerOnDesign = () => {
    const allPoints = [
      ...stones.map((s) => ({ x: s.x, y: s.y })),
      ...paths.flatMap((p) => p.points),
    ];
    if (allPoints.length === 0) { zoomReset(); return; }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    allPoints.forEach((p) => {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    });
    const bw = Math.max(maxX - minX, INCH_PX);
    const bh = Math.max(maxY - minY, INCH_PX);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const fitZoom = Math.min((CANVAS_W * 0.8) / bw, (CANVAS_H * 0.8) / bh);
    const z = Math.max(0.2, Math.min(3, fitZoom));
    const viewW = CANVAS_W / z, viewH = CANVAS_H / z;
    setZoom(z);
    setPan(clampPan(cx - viewW / 2, cy - viewH / 2, z));
  };

  const handleWheel = (e) => {
    if (!svgRef.current) return;
    e.preventDefault();
    const p = getSvgPoint(e);
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    applyZoom(zoom * factor, p.x, p.y);
  };

  // Attach wheel zoom as a native non-passive listener (React onWheel can be passive → preventDefault ignored)
  useEffect(() => {
    const svg = svgRef.current;
    if (!svg) return;
    const handler = (e) => handleWheel(e);
    svg.addEventListener("wheel", handler, { passive: false });
    return () => svg.removeEventListener("wheel", handler);
  }, [zoom, pan]);

  // Combined pointer handling: pan the view when the pan tool is active
  const handleCanvasPointerDown = (e) => {
    if (tool === "path") {
      const p = getSvgPoint(e);
      const now = Date.now();
      const last = lastPenClickRef.current;
      const isDoubleClick = last && (now - last.time) < 400 && Math.hypot(p.x - last.x, p.y - last.y) < (12 / zoom);
      lastPenClickRef.current = { time: now, x: p.x, y: p.y };
      if (isDoubleClick) {
        // this is the second click of a "double-click to finish" gesture — the first click already placed
        // the final point, so don't add another one on top of it (that duplicate was causing a stray spike/tail).
        lastPenClickRef.current = null;
        finishPath();
        return;
      }
      const idx = drawingPoints.length;
      setDrawingPoints((prev) => [...prev, { x: p.x, y: p.y, hx: 0, hy: 0 }]);
      penDragRef.current = { index: idx, start: p };
      return;
    }
    if (tool === "pan") {
      const rect = svgRef.current.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      panDragRef.current = { clientX, clientY, origX: pan.x, origY: pan.y };
      return;
    }
    if (tool === "shape") {
      const p = getSvgPoint(e);
      shapeStartRef.current = { x: p.x, y: p.y };
      setShapePreview({ x: p.x, y: p.y, w: 0, h: 0 });
      return;
    }
    if (tool === "select") {
      // empty-area drag => marquee selection
      const p = getSvgPoint(e);
      marqueeRef.current = { x0: p.x, y0: p.y };
      setMarquee({ x: p.x, y: p.y, w: 0, h: 0 });
    }
  };
  const handleCanvasPointerMove = (e) => {
    if (e.clientX != null && svgRef.current) { const p = getSvgPoint(e); setCursorPos(p); }
    if (tool === "path" && penDragRef.current) {
      const p = getSvgPoint(e);
      const { index, start } = penDragRef.current;
      const hx = p.x - start.x, hy = p.y - start.y;
      setDrawingPoints((prev) => prev.map((pt, i) => (i === index ? { ...pt, hx, hy } : pt)));
      return;
    }
    if (vectorDragRef.current) { moveVectorDrag(e); return; }
    if (pathTransformRef.current) { applyPathTransform(e); return; }
    if (shapeDragRef.current) { moveShapeDrag(e); return; }
    if (stoneDragRef.current) {
      const p = getSvgPoint(e);
      const d = stoneDragRef.current;
      const dx = p.x - d.startX, dy = p.y - d.startY;
      const moved = new Map(d.orig.map((o) => [o.id, { x: o.x + dx, y: o.y + dy }]));
      setStones((prev) => prev.map((s) => moved.has(s.id) ? { ...s, x: moved.get(s.id).x, y: moved.get(s.id).y } : s));
      return;
    }
    if (tool === "shape" && shapeStartRef.current) {
      const p = getSvgPoint(e);
      const s = shapeStartRef.current;
      setShapePreview({ x: Math.min(s.x, p.x), y: Math.min(s.y, p.y), w: Math.abs(p.x - s.x), h: Math.abs(p.y - s.y) });
      return;
    }
    if (marqueeRef.current) {
      const p = getSvgPoint(e);
      const m = marqueeRef.current;
      setMarquee({ x: Math.min(m.x0, p.x), y: Math.min(m.y0, p.y), w: Math.abs(p.x - m.x0), h: Math.abs(p.y - m.y0) });
      return;
    }
    if (panDragRef.current) {
      const rect = svgRef.current.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const viewW = CANVAS_W / zoom;
      const viewH = CANVAS_H / zoom;
      const d = panDragRef.current;
      const dx = ((clientX - d.clientX) / rect.width) * viewW;
      const dy = ((clientY - d.clientY) / rect.height) * viewH;
      setPan(clampPan(d.origX - dx, d.origY - dy, zoom));
    }
  };
  const handleCanvasPointerUp = () => {
    if (tool === "path" && penDragRef.current) { penDragRef.current = null; return; }
    if (vectorDragRef.current) { endVectorDrag(); return; }
    if (pathTransformRef.current) { endPathTransform(); return; }
    if (stoneDragRef.current) { stoneDragRef.current = null; snapshotDesign(); return; }
    if (tool === "shape" && shapeStartRef.current) {
      finalizeShape();
      shapeStartRef.current = null;
      return;
    }
    if (marqueeRef.current) {
      const m = marquee;
      marqueeRef.current = null;
      if (m && (m.w > INCH_PX * 0.15 || m.h > INCH_PX * 0.15)) {
        // select stones inside the box
        const inside = stones.filter((s) => !hiddenSet.has(s.id) && !lockedSet.has(s.id) && s.x >= m.x && s.x <= m.x + m.w && s.y >= m.y && s.y <= m.y + m.h).map((s) => s.id);
        // also select any vector paths whose points fall inside the box
        const insidePaths = paths.filter((p) => p.points.some((pt) => pt.x >= m.x && pt.x <= m.x + m.w && pt.y >= m.y && pt.y <= m.y + m.h)).map((p) => p.id);
        setSelectedIds(inside);
        setSelectedPathIds(insidePaths);
        setSelectedPathId(insidePaths.length === 1 ? insidePaths[0] : null);
      }
      setMarquee(null);
      return;
    }
    endShapeDrag();
    panDragRef.current = null;
  };

  // Start dragging the current selection of stones (or just this stone)
  const handleStonePointerDown = (id, e) => {
    if (tool !== "select") return;
    e.stopPropagation();
    let sel = selectedIds.includes(id) ? selectedIds : [id];
    if (!selectedIds.includes(id)) { setSelectedIds(sel); setSelectedPathId(null); }
    const p = getSvgPoint(e);
    const orig = stones.filter((s) => sel.includes(s.id)).map((s) => ({ id: s.id, x: s.x, y: s.y }));
    stoneDragRef.current = { startX: p.x, startY: p.y, orig };
  };

  // Turn the drag box into a vector shape path (CorelDRAW-style: must click-drag, a mere click does nothing)
  const finalizeShape = () => {
    const box = shapePreview;
    const minSize = INCH_PX * 0.3; // require a real drag, not just a click
    if (!box || box.w < minSize || box.h < minSize) {
      setShapePreview(null);
      return;
    }
    let finalBox = box;
    // squares/circles use equal sides
    if (shapeKind === "square" || shapeKind === "circle") {
      const side = Math.min(box.w, box.h);
      finalBox = { x: box.x, y: box.y, w: side, h: side };
    }
    const pts = generateShapePoints(shapeKind, finalBox.x, finalBox.y, finalBox.w, finalBox.h);
    const closed = [...pts, pts[0]];
    const newPath = {
      id: nextId(),
      points: closed,
      ss: activeSS,
      mm: activeSizeObj.mm,
      color: activeColor,
      gap: 1.15,
      shape: shapeKind,
    };
    setPaths((p) => [...p, newPath]);
    setSelectedPathId(newPath.id);
    setShapePreview(null);
    setTimeout(snapshotDesign, 0);
    setTool("select"); // switch to select so handles + dimensions show right away (CorelDRAW-style)
  };

  // ---- Shape (path) selection + transform (CorelDRAW-style) ----
  const pathTransformRef = useRef(null);

  const pathBBox = (pts) => {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    pts.forEach((p) => {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    });
    return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
  };

  const selectedPath = paths.find((p) => p.id === selectedPathId) || null;

  const startPathMove = (e) => {
    if (tool !== "select" || !selectedPathId) return;
    e.stopPropagation();
    const p = getSvgPoint(e);
    const path = paths.find((pp) => pp.id === selectedPathId);
    pathTransformRef.current = { mode: "move", startX: p.x, startY: p.y, origPoints: path.points.map((pt) => ({ ...pt })) };
  };

  const startPathResize = (e, handle) => {
    e.stopPropagation();
    const path = paths.find((pp) => pp.id === selectedPathId);
    if (!path) return;
    const bb = pathBBox(path.points);
    // which axes this handle scales
    const scaleX = handle.includes("l") || handle.includes("r");
    const scaleY = handle.includes("t") || handle.includes("b");
    // the dragged edge position and the fixed anchor (opposite edge)
    const handleX = handle.includes("l") ? bb.minX : bb.maxX;
    const handleY = handle.includes("t") ? bb.minY : bb.maxY;
    const anchor = {
      x: handle.includes("l") ? bb.maxX : bb.minX,
      y: handle.includes("t") ? bb.maxY : bb.minY,
    };
    pathTransformRef.current = {
      mode: "resize", handle, anchor, handleX, handleY, scaleX, scaleY,
      origPoints: path.points.map((pt) => ({ ...pt })),
    };
  };

  const applyPathTransform = (e) => {
    const t = pathTransformRef.current;
    if (!t) return;
    const p = getSvgPoint(e);
    if (t.mode === "move") {
      const dx = p.x - t.startX, dy = p.y - t.startY;
      setPaths((prev) => prev.map((pp) => pp.id === selectedPathId ? { ...pp, points: t.origPoints.map((o) => ({ x: o.x + dx, y: o.y + dy })) } : pp));
    } else if (t.mode === "resize") {
      const { anchor, handleX, handleY, scaleX, scaleY } = t;
      let sx = 1, sy = 1;
      if (scaleX) {
        sx = (p.x - anchor.x) / ((handleX - anchor.x) || 1);
        sx = Math.max(0.05, Math.abs(sx)) * (sx < 0 ? -1 : 1);
      }
      if (scaleY) {
        sy = (p.y - anchor.y) / ((handleY - anchor.y) || 1);
        sy = Math.max(0.05, Math.abs(sy)) * (sy < 0 ? -1 : 1);
      }
      // if aspect is locked and this is a corner, keep proportion
      if (lockAspect && scaleX && scaleY) {
        const s = Math.max(Math.abs(sx), Math.abs(sy));
        sx = s * (sx < 0 ? -1 : 1);
        sy = s * (sy < 0 ? -1 : 1);
      }
      setPaths((prev) => prev.map((pp) => pp.id === selectedPathId ? { ...pp, points: t.origPoints.map((o) => ({ x: anchor.x + (o.x - anchor.x) * sx, y: anchor.y + (o.y - anchor.y) * sy })) } : pp));
    } else if (t.mode === "node") {
      setPaths((prev) => prev.map((pp) => {
        if (pp.id !== selectedPathId) return pp;
        const pts = pp.points.slice();
        pts[t.nodeIndex] = { x: p.x, y: p.y };
        return { ...pp, points: pts };
      }));
    }
  };

  const endPathTransform = () => {
    const t = pathTransformRef.current;
    pathTransformRef.current = null;
    if (!t) return;
    // if the transformed path has stones, regenerate them to match the new outline; otherwise still commit the shape edit to history
    const path = paths.find((pp) => pp.id === selectedPathId);
    if (path && stones.some((s) => s.pathId === path.id)) {
      refillPath(path);
    } else if (path) {
      commitPaths(pathsRef.current);
    }
  };

  // ---- Node Edit (Shape) tool: drag / add / delete individual points on a vector path ----
  const startNodeDrag = (pathId, idx, e) => {
    e.stopPropagation();
    const path = paths.find((pp) => pp.id === pathId);
    if (!path) return;
    setSelectedPathId(pathId);
    setSelectedNodeIndex(idx);
    pathTransformRef.current = { mode: "node", nodeIndex: idx, origPoints: path.points.map((pt) => ({ ...pt })) };
  };

  const deleteNode = (pathId, idx) => {
    setPaths((prev) => prev.map((pp) => {
      if (pp.id !== pathId || pp.points.length <= 2) return pp;
      return { ...pp, points: pp.points.filter((_, i) => i !== idx) };
    }));
    setSelectedNodeIndex((cur) => {
      const path = pathsRef.current.find((pp) => pp.id === pathId);
      if (!path || path.points.length <= 2) return cur; // deletion was blocked (min 2 points)
      const remaining = path.points.length - 1; // length after this deletion resolves
      return Math.min(idx, remaining - 1);
    });
    setTimeout(() => {
      const path = pathsRef.current.find((pp) => pp.id === pathId);
      if (!path) return;
      if (stonesRef.current.some((s) => s.pathId === pathId)) refillPath(path);
      else commitPaths(pathsRef.current);
    }, 0);
  };

  const addNodeOnSegment = (pathId, segIdx, pt) => {
    setPaths((prev) => prev.map((pp) => {
      if (pp.id !== pathId) return pp;
      const pts = pp.points.slice();
      pts.splice(segIdx + 1, 0, { x: pt.x, y: pt.y });
      return { ...pp, points: pts };
    }));
    setSelectedNodeIndex(segIdx + 1); // jump straight to the freshly-added node
    setTimeout(() => {
      const path = pathsRef.current.find((pp) => pp.id === pathId);
      if (!path) return;
      if (stonesRef.current.some((s) => s.pathId === pathId)) refillPath(path);
      else commitPaths(pathsRef.current);
    }, 0);
  };

  // Precisely resize the selected path to an exact width/height (inches), scaling around its own bounding-box center
  const resizeSelectedPathTo = (newWIn, newHIn) => {
    const path = paths.find((pp) => pp.id === selectedPathId);
    if (!path || path.points.length === 0) return;
    const xs = path.points.map((p) => p.x), ys = path.points.map((p) => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const curW = maxX - minX || 1, curH = maxY - minY || 1;
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const targetW = Math.max(0.1, newWIn) * INCH_PX;
    const targetH = Math.max(0.1, newHIn) * INCH_PX;
    const sx = targetW / curW, sy = targetH / curH;
    const nextPoints = path.points.map((p) => ({ x: cx + (p.x - cx) * sx, y: cy + (p.y - cy) * sy }));
    const nextPath = { ...path, points: nextPoints };
    const nextPaths = paths.map((pp) => (pp.id === path.id ? nextPath : pp));
    if (stones.some((s) => s.pathId === path.id)) {
      const nextStones = [...stones.filter((s) => s.pathId !== path.id), ...stonesForPath(nextPath)];
      commitDesign(nextStones, nextPaths);
    } else {
      commitPaths(nextPaths);
    }
  };

  // ---- Knife tool: cut a vector path into two separate paths at the clicked node ----
  const knifeCutPath = (e) => {
    const p = getSvgPoint(e);
    const THRESH = 30;
    let bestPath = null, bestIdx = -1, bestDist = THRESH;
    paths.forEach((path) => {
      path.points.forEach((pt, i) => {
        if (i === 0 || i === path.points.length - 1) return; // ends can't be split further
        const d = Math.hypot(pt.x - p.x, pt.y - p.y);
        if (d < bestDist) { bestDist = d; bestPath = path; bestIdx = i; }
      });
    });
    if (!bestPath) { alert("Kisi vector line ke point (node) ke paas click karo cut karne ke liye. Zoom in karke precise click karo."); return; }
    const pts = bestPath.points;
    const partA = pts.slice(0, bestIdx + 1);
    const partB = pts.slice(bestIdx);
    const hadStones = stones.some((s) => s.pathId === bestPath.id);
    const newA = { ...bestPath, id: nextId(), points: partA };
    const newB = { ...bestPath, id: nextId(), points: partB };
    const nextPaths = [...paths.filter((pp) => pp.id !== bestPath.id), newA, newB];
    if (hadStones) {
      const stonesA = stonesForPath(newA);
      const stonesB = stonesForPath(newB);
      const nextStones = [...stones.filter((s) => s.pathId !== bestPath.id), ...stonesA, ...stonesB];
      commitDesign(nextStones, nextPaths);
    } else {
      commitPaths(nextPaths);
    }
    setSelectedPathId(null);
  };

  // Resize the selected shape to an exact width/height in pixels (anchored at top-left)
  const resizeSelectedPathToPx = (wPx, hPx) => {
    const path = paths.find((pp) => pp.id === selectedPathId);
    if (!path) return;
    const bb = pathBBox(path.points);
    const sx = bb.w ? wPx / bb.w : 1;
    const sy = bb.h ? hPx / bb.h : 1;
    const anchor = { x: bb.minX, y: bb.minY };
    const newPoints = path.points.map((o) => ({ x: anchor.x + (o.x - anchor.x) * sx, y: anchor.y + (o.y - anchor.y) * sy }));
    setPaths((prev) => prev.map((pp) => pp.id === selectedPathId ? { ...pp, points: newPoints } : pp));
    if (stones.some((s) => s.pathId === path.id)) {
      refillPath({ ...path, points: newPoints });
    }
  };

  const handleCanvasClick = (e) => {
    if (pickingHotspot) {
      const p = getSvgPoint(e);
      setGradHotspot(p);
      setPickingHotspot(false);
      return;
    }
    if (pickingHotspot2) {
      const p = getSvgPoint(e);
      setGradHotspot2(p);
      setPickingHotspot2(false);
      return;
    }
    if (tool === "pan" || tool === "shape") return;
    if (tool === "path") return; // anchor placement is handled in handleCanvasPointerDown (supports drag-to-curve)
    if (tool === "nodeEdit") return; // node selection/drag is handled directly on each node/segment
    if (tool === "knife") { knifeCutPath(e); return; }
    if (tool !== "stone") return;
    let { x, y } = getSvgPoint(e);
    if (snapToGrid) {
      const step = snapMm * PX_PER_MM;
      x = Math.round(x / step) * step;
      y = Math.round(y / step) * step;
    }
    const r = (activeSizeObj.mm * PX_PER_MM) / 2;
    // prevent overlap with existing stone at click point
    const clash = stones.some((s) => Math.hypot(s.x - x, s.y - y) < r * 0.8);
    if (clash) return;
    const next = [
      ...stones,
      { id: nextId(), x, y, ss: activeSS, mm: activeSizeObj.mm, color: activeColor, pathId: null },
    ];
    commitStones(next);
  };

  const removeStone = (id, e) => {
    e.stopPropagation();
    commitStones(stones.filter((s) => s.id !== id));
    setSelectedIds((ids) => ids.filter((x) => x !== id));
  };

  const handleStoneClick = (id, e) => {
    e.stopPropagation();
    if (tool === "erase") {
      commitStones(stones.filter((s) => s.id !== id));
      setSelectedIds((ids) => ids.filter((x) => x !== id));
    } else if (tool === "select") {
      // toggle this stone in/out of the selection
      setSelectedIds((ids) => (ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id]));
    }
  };

  const selectAll = () => setSelectedIds(stones.filter((s) => !hiddenSet.has(s.id) && !lockedSet.has(s.id)).map((s) => s.id));
  const deselectAll = () => setSelectedIds([]);

  // ---- Drag a whole vector path (Corel-style move) ----
  const vectorDragRef = useRef(null);
  const startVectorDrag = (pathId, e) => {
    const p = getSvgPoint(e);
    const path = pathsRef.current.find((pp) => pp.id === pathId);
    if (!path) return;
    vectorDragRef.current = { id: pathId, startX: p.x, startY: p.y, orig: path.points.map((pt) => ({ ...pt })), moved: false };
  };
  const moveVectorDrag = (e) => {
    const d = vectorDragRef.current;
    if (!d) return;
    const p = getSvgPoint(e);
    const dx = p.x - d.startX, dy = p.y - d.startY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) d.moved = true;
    setPaths((prev) => prev.map((pp) => pp.id === d.id ? { ...pp, points: d.orig.map((pt) => ({ x: pt.x + dx, y: pt.y + dy })) } : pp));
  };
  const endVectorDrag = () => {
    const d = vectorDragRef.current;
    vectorDragRef.current = null;
    if (d && d.moved) snapshotDesign();
  };

  // Move the whole design (stones + vector shapes) so it's centered inside the canvas.
  // Also scales it down if it's larger than the canvas, so nothing sits off-screen.
  const centerDesign = () => {
    if (stones.length === 0 && paths.length === 0) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    stones.forEach((s) => {
      const r = (s.mm * PX_PER_MM) / 2;
      minX = Math.min(minX, s.x - r); maxX = Math.max(maxX, s.x + r);
      minY = Math.min(minY, s.y - r); maxY = Math.max(maxY, s.y + r);
    });
    paths.forEach((p) => p.points.forEach((pt) => {
      minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
      minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y);
    }));
    if (!isFinite(minX)) return;
    const w = maxX - minX, h = maxY - minY;
    const margin = INCH_PX; // 1 inch margin
    const scale = Math.min(1, (CANVAS_W - margin * 2) / (w || 1), (CANVAS_H - margin * 2) / (h || 1));
    const curCx = (minX + maxX) / 2, curCy = (minY + maxY) / 2;
    const tgtCx = CANVAS_W / 2, tgtCy = CANVAS_H / 2;
    const tx = (x) => tgtCx + (x - curCx) * scale;
    const ty = (y) => tgtCy + (y - curCy) * scale;
    commitStones(stones.map((s) => ({ ...s, x: tx(s.x), y: ty(s.y), mm: s.mm * scale })));
    setPaths((prev) => prev.map((p) => ({ ...p, points: p.points.map((pt) => ({ x: tx(pt.x), y: ty(pt.y) })) })));
    zoomReset();
  };

  // Apply the active size to selected stones (only when a selection exists)
  const applySizeToSelection = (sizeObj) => {
    if (selectedIds.length === 0) return;
    const target = new Set(selectedIds);
    commitStones(stones.map((s) => (target.has(s.id) ? { ...s, ss: sizeObj.ss, mm: sizeObj.mm } : s)));
  };

  const applyColorToSelection = (colorObj) => {
    if (selectedIds.length === 0) return;
    const target = new Set(selectedIds);
    commitStones(stones.map((s) => (target.has(s.id) ? { ...s, color: colorObj } : s)));
  };

  // Picking a size: set it active for new stones, and if stones are selected, update them live
  const pickSize = (sizeObj) => {
    setActiveSS(sizeObj.ss);
    applySizeToSelection(sizeObj);
  };

  const pickColor = (colorObj) => {
    setActiveColor(colorObj);
    applyColorToSelection(colorObj);
  };

  const clearAll = () => {
    commitDesign([], []);
    setSelectedIds([]);
    setSelectedPathId(null);
    setSelectedPathIds([]);
    setSelectedNodeIndex(null);
    setBlingPreview(null);
    if (!liveFill) setPlacedShape(null);
  };

  // ---- Pages (Corel-style tabs: switch between independent designs, each with its own undo history) ----
  const switchToPage = (pageId) => {
    if (pageId === activePageId) return;
    // stash the current page's design + history before leaving it
    pagesDataRef.current[activePageId] = {
      stones: stonesRef.current,
      paths: pathsRef.current,
      history: historyRef.current,
      historyIdx: historyIdxRef.current,
    };
    const incoming = pagesDataRef.current[pageId] || { stones: [], paths: [], history: [{ stones: [], paths: [] }], historyIdx: 0 };
    setStones(incoming.stones);
    setPaths(incoming.paths);
    historyRef.current = incoming.history;
    historyIdxRef.current = incoming.historyIdx;
    setHistory(incoming.history);
    setHistoryIdx(incoming.historyIdx);
    setSelectedIds([]);
    setSelectedPathId(null);
    setSelectedPathIds([]);
    setSelectedNodeIndex(null);
    setPlacedShape(null);
    // clear anything tied to the page we're leaving — otherwise a pending preview/drawing/picker
    // from the old page would linger and show up (or misapply) on the new page's canvas
    setBlingPreview(null);
    setDrawingPoints([]);
    setPickingHotspot(false);
    setPickingHotspot2(false);
    setGradHotspot(null);
    setGradHotspot2(null);
    setBoxSelectRect(null);
    setMarquee(null);
    setShowRemovedPanel(false);
    setActivePageId(pageId);
  };

  const addNewPage = () => {
    const id = nextPageIdRef.current++;
    pagesDataRef.current[id] = { stones: [], paths: [], history: [{ stones: [], paths: [] }], historyIdx: 0 };
    setPages((prev) => [...prev, { id, name: `Page ${prev.length + 1}` }]);
    switchToPage(id);
  };

  const closePage = (pageId, e) => {
    e.stopPropagation();
    if (pages.length <= 1) return; // always keep at least one page
    delete pagesDataRef.current[pageId];
    const remaining = pages.filter((pg) => pg.id !== pageId);
    setPages(remaining);
    if (pageId === activePageId) {
      const fallback = remaining[remaining.length - 1];
      const incoming = pagesDataRef.current[fallback.id] || { stones: [], paths: [], history: [{ stones: [], paths: [] }], historyIdx: 0 };
      setStones(incoming.stones);
      setPaths(incoming.paths);
      historyRef.current = incoming.history;
      historyIdxRef.current = incoming.historyIdx;
      setHistory(incoming.history);
      setHistoryIdx(incoming.historyIdx);
      setSelectedIds([]);
      setSelectedPathId(null);
      setSelectedPathIds([]);
      setSelectedNodeIndex(null);
      setPlacedShape(null);
      setBlingPreview(null);
      setDrawingPoints([]);
      setPickingHotspot(false);
      setPickingHotspot2(false);
      setGradHotspot(null);
      setGradHotspot2(null);
      setBoxSelectRect(null);
      setMarquee(null);
      setShowRemovedPanel(false);
      setActivePageId(fallback.id);
    }
  };

  // ---- Vector path helpers ----
  const pathLength = (points) => {
    let len = 0;
    for (let i = 1; i < points.length; i++) {
      len += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
    }
    return len;
  };

  const pointAtDistance = (points, dist) => {
    let remaining = dist;
    for (let i = 1; i < points.length; i++) {
      const segLen = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
      if (remaining <= segLen) {
        const t = segLen === 0 ? 0 : remaining / segLen;
        return {
          x: points[i - 1].x + (points[i].x - points[i - 1].x) * t,
          y: points[i - 1].y + (points[i].y - points[i - 1].y) * t,
        };
      }
      remaining -= segLen;
    }
    return points[points.length - 1];
  };

  // Generate stones evenly spaced along a path's length, maintaining a gap based on stone size
  const stonesForPath = (path) => {
    const total = pathLength(path.points);
    const step = path.mm * PX_PER_MM * path.gap;
    if (total < step) return [];
    const count = Math.floor(total / step);
    const generated = [];
    for (let i = 0; i <= count; i++) {
      const pt = pointAtDistance(path.points, i * step);
      generated.push({
        id: nextId(),
        x: pt.x,
        y: pt.y,
        ss: path.ss,
        mm: path.mm,
        color: path.color,
        pathId: path.id,
      });
    }
    return generated;
  };

  // Re-fill a path: remove its old stones, generate fresh ones from current settings
  const refillPath = (updatedPath) => {
    const newStones = stonesForPath(updatedPath);
    const withoutOldPathStones = stones.filter((s) => s.pathId !== updatedPath.id);
    commitStones([...withoutOldPathStones, ...newStones]);
  };

  // ---- Graduated Fill (premium): big stones at the start, smaller toward the end ----
  // Sizes come from gradSizes in the user's chosen order (1st, 2nd, 3rd...).
  // The line is split into equal-length zones, one per size; stone spacing adapts per zone.
  const runGraduatedFill = () => {
    const seq = gradSizes.map((ss) => stoneSizes.find((s) => s.ss === ss)).filter(Boolean);
    if (seq.length === 0) { alert("Kam se kam ek size chuno."); return; }

    const path = paths.find((p) => p.id === selectedPathId);
    // color-blend helper: mix activeColor → gradColor2 along t (0..1)
    const hex2rgb = (hex) => { const n = parseInt(hex.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const rgb2hex = (r, g, b) => "#" + [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
    const cA = hex2rgb(activeColor.hex), cB = hex2rgb(gradColor2.hex);
    const colorAt = (t) => {
      if (!gradColorBlend) return activeColor;
      return { name: `${activeColor.name}→${gradColor2.name}`, hex: rgb2hex(cA[0] + (cB[0] - cA[0]) * t, cA[1] + (cB[1] - cA[1]) * t, cA[2] + (cB[2] - cA[2]) * t) };
    };
    // size index from progress t (0..1); 'taper' = big in the middle, small at both ends
    const sizeAt = (t) => {
      let tt = t;
      if (gradPattern === "taper") tt = 1 - Math.abs(t - 0.5) * 2; // 0 at ends, 1 at center
      // for taper: big (index 0) at center → invert so center uses first size
      const idxT = gradPattern === "taper" ? 1 - tt : t;
      return seq[Math.min(seq.length - 1, Math.floor(idxT * seq.length))];
    };

    // Case A: a selected vector line — graduate along the line, with real 2D collision-avoidance
    // (not just spacing along the path's length — a curvy/looping design can bring two points that are
    // far apart ALONG the line very close together in actual space, e.g. where petals or wing tips curl
    // back near each other; without a spatial check those would still overlap visually).
    if (path) {
      const total = pathLength(path.points);
      if (total <= 0) return;
      const gapMult = 1 + (fillPanel.space || 0);
      const out = [];
      const maxMm = Math.max(...seq.map((s) => s.mm));
      const cell = Math.max(1, maxMm * PX_PER_MM * gapMult);
      const grid = new Map();
      const nearby = (x, y, minDist) => {
        const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
          const arr = grid.get((gx + dx) + "," + (gy + dy));
          if (arr) for (const q of arr) if (Math.hypot(q.x - x, q.y - y) < minDist) return true;
        }
        return false;
      };
      let d = 0;
      while (d <= total && out.length < MAX_STONES_PER_FILL) {
        const t = d / total;
        const sizeObj = sizeAt(t);
        const pt = pointAtDistance(path.points, d);
        const minDist = sizeObj.mm * PX_PER_MM * gapMult * 0.9; // small slack so the line still reads continuous
        if (!nearby(pt.x, pt.y, minDist)) {
          const k = Math.floor(pt.x / cell) + "," + Math.floor(pt.y / cell);
          if (!grid.has(k)) grid.set(k, []);
          grid.get(k).push(pt);
          out.push({ id: nextId(), x: pt.x, y: pt.y, ss: sizeObj.ss, mm: sizeObj.mm, color: colorAt(t), pathId: null });
        }
        d += sizeObj.mm * PX_PER_MM * gapMult;
      }
      commitFillResult(out);
      return;
    }

    // Case B: a placed image (traced) — graduate its centerline stones by:
    //  - 'radial': distance from a center point (design's own center, or a custom hotspot you click), or
    //  - 'thickness': actual local stroke thickness (1st size = thickest strokes, last size = thinnest), or
    //  - 'halo': alternating ring colours radiating out from the center/hotspot — a premium banded-glow look
    if (placedShape && placedShape.skeleton && placedShape.skeleton.length > 0) {
      const cx = gradHotspot ? gradHotspot.x : placedShape.x + placedShape.w / 2;
      const cy = gradHotspot ? gradHotspot.y : placedShape.y + placedShape.h / 2;
      const maxR = Math.hypot(placedShape.w, placedShape.h) / 2 || 1;
      const pts = placedShape.skeleton.map((p) => ({
        x: placedShape.x + p.x * placedShape.w,
        y: placedShape.y + p.y * placedShape.h,
        t: p.t == null ? 0.5 : p.t, // 0 = thinnest stroke, 1 = thickest stroke (percentile-ranked)
      }));
      // largest stone diameter sets the spacing so nothing overlaps
      const baseStep = Math.max(...seq.map((s) => s.mm)) * PX_PER_MM * (1 + (fillPanel.space || 0));
      const minDist = baseStep * 0.85, cell = baseStep;
      const ringPx = haloRingMm * PX_PER_MM;
      const grid = new Map();
      const out = [];
      const nearby = (x, y) => {
        const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
          const arr = grid.get((gx + dx) + "," + (gy + dy));
          if (arr) for (const q of arr) if (Math.hypot(q.x - x, q.y - y) < minDist) return true;
        }
        return false;
      };
      for (const p of pts) {
        if (nearby(p.x, p.y)) continue;
        let zone, colorForPoint = activeColor;
        if (gradMode === "thickness") {
          // 1st size (start of the list) = thickest strokes, last size = thinnest
          zone = Math.min(seq.length - 1, Math.floor((1 - p.t) * seq.length));
        } else if (gradMode === "halo") {
          let r = Math.hypot(p.x - cx, p.y - cy);
          if (gradHotspot2) r = Math.min(r, Math.hypot(p.x - gradHotspot2.x, p.y - gradHotspot2.y));
          const ring = Math.floor(r / ringPx);
          zone = Math.min(seq.length - 1, ring % seq.length); // sizes can still cycle if more than one is set
          const pal = haloColors.filter(Boolean);
          colorForPoint = pal.length > 0 ? pal[ring % pal.length] : activeColor;
        } else {
          const r = Math.hypot(p.x - cx, p.y - cy) / maxR; // 0 at center/hotspot → 1 at edge
          zone = Math.min(seq.length - 1, Math.floor(r * seq.length));
        }
        const sizeObj = seq[zone];
        const k = Math.floor(p.x / cell) + "," + Math.floor(p.y / cell);
        if (!grid.has(k)) grid.set(k, []);
        grid.get(k).push(p);
        out.push({ id: nextId(), x: p.x, y: p.y, ss: sizeObj.ss, mm: sizeObj.mm, color: gradMode === "halo" ? colorForPoint : activeColor, pathId: null });
        if (out.length >= MAX_STONES_PER_FILL) break;
      }
      commitFillResult(out);
      if (!liveFill) setPlacedShape(null);
      return;
    }

    alert("Pehle ek vector line select karo (Line tool se banao), ya ek image place karo (trace karke) — phir Graduated Fill dabao.");
  };

  // ---- Island Fill ----
  const polygonCentroid = (pts) => {
    let x = 0, y = 0;
    pts.forEach((p) => { x += p.x; y += p.y; });
    return { x: x / pts.length, y: y / pts.length };
  };

  // Offset a closed polygon outward (dist>0) or inward (dist<0) using a miter join
  const offsetPolygon = (pts, dist) => {
    const c = polygonCentroid(pts);
    const n = pts.length;
    const out = [];
    for (let i = 0; i < n; i++) {
      const prev = pts[(i - 1 + n) % n];
      const cur = pts[i];
      const next = pts[(i + 1) % n];
      let e1x = cur.x - prev.x, e1y = cur.y - prev.y;
      let e2x = next.x - cur.x, e2y = next.y - cur.y;
      const l1 = Math.hypot(e1x, e1y) || 1, l2 = Math.hypot(e2x, e2y) || 1;
      e1x /= l1; e1y /= l1; e2x /= l2; e2y /= l2;
      const n1x = e1y, n1y = -e1x; // edge normals
      const n2x = e2y, n2y = -e2x;
      let bx = n1x + n2x, by = n1y + n2y;
      const bl = Math.hypot(bx, by) || 1; bx /= bl; by /= bl;
      // make bisector point outward (away from centroid)
      const ox = cur.x - c.x, oy = cur.y - c.y;
      if (bx * ox + by * oy < 0) { bx = -bx; by = -by; }
      // miter length, clamped so sharp corners don't spike
      const cosHalf = Math.max(0.35, Math.abs(bx * n1x + by * n1y));
      const miter = dist / cosHalf;
      out.push({ x: cur.x + bx * miter, y: cur.y + by * miter });
    }
    return out;
  };

  // Get the base polygon for island/offset fills: from selected path, or placed shape bbox
  // All base polygons for fills (handles multi-part image designs)
  const getBasePolygonsAll = () => {
    const activePath = paths.find((p) => p.id === selectedPathId) || (paths.length === 1 ? paths[0] : null);
    if (activePath && activePath.points.length >= 3) {
      const pts = activePath.points.slice();
      const first = pts[0], last = pts[pts.length - 1];
      if (first.x === last.x && first.y === last.y) pts.pop();
      return [pts];
    }
    if (placedShape) {
      const { x, y, w, h, contours } = placedShape;
      if (contours && contours.length > 0) {
        return contours.map((c) => c.map((p) => ({ x: x + p.x * w, y: y + p.y * h })));
      }
      return [[{ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }]];
    }
    return [];
  };

  const getBasePolygon = () => {
    const all = getBasePolygonsAll();
    return all.length > 0 ? all[0] : null;
  };

  const runIslandFill = () => {
    const polys = getBasePolygonsAll();
    if (polys.length === 0) {
      alert("Pehle ek shape do: image upload karke place karo, ya Line tool se ek shape banao (phir Select tool se use chuno).");
      return;
    }
    const rings = Math.max(1, Math.round(fillPanel.islands) || 1);
    const spacingPx = fillPanel.contourSpacing * PX_PER_MM;
    const dir = fillPanel.side === "outside" ? 1 : -1;
    const gap = 1 + (fillPanel.space || 0); // stone center spacing multiplier

    const newPaths = [];
    let newStones = [];
    for (const base of polys) {
      for (let k = 1; k <= rings; k++) {
        const off = offsetPolygon(base, dir * spacingPx * k);
        const ringPts = [...off, off[0]];
        const ringPath = {
          id: nextId(),
          points: ringPts,
          ss: activeSS,
          mm: activeSizeObj.mm,
          color: activeColor,
          gap,
          island: true,
        };
        newPaths.push(ringPath);
        if (fillPanel.addStones) {
          newStones = newStones.concat(stonesForPath(ringPath));
        }
      }
    }
    setPaths((p) => [...p, ...newPaths]);
    if (fillPanel.addStones && newStones.length > 0) {
      commitStones([...stones, ...newStones]);
    }
  };

  // Interior angle (degrees) at vertex `cur` between edges to prev and next
  const vertexAngleDeg = (prev, cur, next) => {
    let ax = prev.x - cur.x, ay = prev.y - cur.y;
    let bx = next.x - cur.x, by = next.y - cur.y;
    const la = Math.hypot(ax, ay) || 1, lb = Math.hypot(bx, by) || 1;
    let d = (ax * bx + ay * by) / (la * lb);
    d = Math.max(-1, Math.min(1, d));
    return (Math.acos(d) * 180) / Math.PI;
  };

  // ---- Path Fill (outline fill) ----
  // Places stones along the shape outline. With Corner Detect on, a stone is forced
  // exactly on each sharp corner (line breaks at corners) so the design stays crisp.
  // Shared: single-line stones along the placed image's skeleton centerline
  const skeletonSingleLineFill = () => {
    const sizeObj = activeSizeObj;
    // stone center-to-center distance: diameter * (1 + space). space 0 = stones touch.
    const step = sizeObj.mm * PX_PER_MM * (1 + (fillPanel.space || 0));
    const minDist = step * 0.85; // allow slight overlap so the line stays continuous
    const cell = step;
    const grid = new Map(); // cellKey -> array of placed points
    const out = [];
    const pts = placedShape.skeleton.map((p) => ({ x: placedShape.x + p.x * placedShape.w, y: placedShape.y + p.y * placedShape.h }));
    const nearby = (x, y) => {
      const cx = Math.floor(x / cell), cy = Math.floor(y / cell);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const arr = grid.get((cx + dx) + "," + (cy + dy));
        if (arr) for (const q of arr) if (Math.hypot(q.x - x, q.y - y) < minDist) return true;
      }
      return false;
    };
    const place = (colorAt) => {
      for (const p of pts) {
        if (nearby(p.x, p.y)) continue;
        const ck = Math.floor(p.x / cell) + "," + Math.floor(p.y / cell);
        if (!grid.has(ck)) grid.set(ck, []);
        grid.get(ck).push(p);
        out.push({ id: nextId(), x: p.x, y: p.y, ss: sizeObj.ss, mm: sizeObj.mm, color: colorAt ? colorAt(p.x, p.y) : activeColor, pathId: null });
        if (out.length >= MAX_STONES_PER_FILL) break;
      }
      commitFillResult(out);
      if (!liveFill) setPlacedShape(null);
    };
    // If the placed vector already has multiple colours baked in (from the import colour-zone preview),
    // sample each stone's colour straight from that image — so multi-colour vectors auto-produce multi-colour stones.
    if (placedShape.dataUrl) {
      const img = new window.Image();
      img.onload = () => {
        const off = document.createElement("canvas");
        off.width = CANVAS_W; off.height = CANVAS_H;
        const octx = off.getContext("2d");
        octx.drawImage(img, placedShape.x, placedShape.y, placedShape.w, placedShape.h);
        const data = octx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;
        const nearestColor = (r, g, b) => {
          let best = STONE_COLORS[0], bestD = Infinity;
          for (const c of STONE_COLORS) {
            const n = parseInt(c.hex.replace("#", ""), 16);
            const cr = (n >> 16) & 255, cg = (n >> 8) & 255, cb = n & 255;
            const d = (r - cr) ** 2 + (g - cg) ** 2 + (b - cb) ** 2;
            if (d < bestD) { bestD = d; best = c; }
          }
          return best;
        };
        place((x, y) => {
          const idx = (Math.floor(y) * CANVAS_W + Math.floor(x)) * 4;
          const r = data[idx], g = data[idx + 1], b = data[idx + 2], a = data[idx + 3];
          if (a < 50) return activeColor;
          // the plain single-colour mask paints #221F2A — treat that as "no zone colour", use activeColor
          if (Math.abs(r - 34) < 6 && Math.abs(g - 31) < 6 && Math.abs(b - 42) < 6) return activeColor;
          return nearestColor(r, g, b);
        });
      };
      img.src = placedShape.dataUrl;
    } else {
      place(null);
    }
  };

  // ---- Apply a Design Preset: fill placed image by thickness using preset's size+color combo ----
  const applyDesignPreset = (presetId) => {
    const preset = designPresets.find((p) => p.id === presetId);
    if (!preset || !preset.combo.length) { alert("Preset khali hai."); return; }
    if (!placedShape || !placedShape.skeleton || placedShape.skeleton.length === 0) {
      alert("Pehle ek image trace karke Approve karo, phir preset apply karo.");
      return;
    }
    // build size sequence (thin→thick) with matching colors, sorted by mm
    const combo = preset.combo
      .map((c) => {
        const sz = stoneSizes.find((s) => s.ss === c.ss);
        const col = STONE_COLORS.find((x) => x.name === c.color) || activeColor;
        return sz ? { sz, col } : null;
      })
      .filter(Boolean)
      .sort((a, b) => a.sz.mm - b.sz.mm);
    if (combo.length === 0) { alert("Preset ke sizes valid nahi."); return; }

    const maxMm = Math.max(...combo.map((c) => c.sz.mm));
    const baseStep = maxMm * PX_PER_MM * (1 + (fillPanel.space || 0));
    const minDist = baseStep * 0.7, cell = baseStep;
    const grid = new Map();
    const out = [];
    const pts = placedShape.skeleton.map((p) => ({
      x: placedShape.x + p.x * placedShape.w,
      y: placedShape.y + p.y * placedShape.h,
      t: p.t == null ? 0.5 : p.t,
    }));
    const nearby = (x, y, r) => {
      const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const arr = grid.get((gx + dx) + "," + (gy + dy));
        if (arr) for (const q of arr) if (Math.hypot(q.x - x, q.y - y) < r) return true;
      }
      return false;
    };
    pts.sort((a, b) => b.t - a.t); // thickest first
    for (const p of pts) {
      const zone = Math.min(combo.length - 1, Math.floor(p.t * combo.length));
      const { sz, col } = combo[zone];
      const localDist = sz.mm * PX_PER_MM * (1 + (fillPanel.space || 0)) * 0.85;
      if (nearby(p.x, p.y, Math.max(minDist, localDist))) continue;
      const ck = Math.floor(p.x / cell) + "," + Math.floor(p.y / cell);
      if (!grid.has(ck)) grid.set(ck, []);
      grid.get(ck).push(p);
      out.push({ id: nextId(), x: p.x, y: p.y, ss: sz.ss, mm: sz.mm, color: col, pathId: null });
      if (out.length >= MAX_STONES_PER_FILL) break;
    }
    commitFillResult(out);
  };

  // Save the current preset builder rows as a new named design preset
  const saveDesignPreset = () => {
    const name = prompt("Preset ka naam do:");
    if (!name) return;
    const combo = presetBuilder.filter((r) => r.ss && r.color);
    if (combo.length === 0) { alert("Kam se kam ek size+color row add karo."); return; }
    const id = "dp" + Date.now();
    setDesignPresets((prev) => [...prev, { id, name, combo }]);
    setSelectedDesignPreset(id);
  };

  // ---- Auto Design: one click → pick N sizes automatically and fill by thickness ----
  const autoDesign = () => {
    const ps = placedShapeRef.current || placedShape;
    if (!ps || !ps.skeleton || ps.skeleton.length === 0) {
      alert("Pehle ek image trace karke Approve karo, phir Auto Design dabao.");
      return;
    }
    recordAction("Auto Design", autoDesign);
    const n = Math.max(1, Math.min(5, autoDesignCount));
    // spread N sizes evenly across the available stone sizes (small → large)
    const sorted = [...stoneSizes].sort((a, b) => a.mm - b.mm);
    const picked = [];
    for (let i = 0; i < n; i++) {
      const idx = n === 1 ? Math.floor(sorted.length / 2) : Math.round((i / (n - 1)) * (sorted.length - 1));
      picked.push(sorted[idx].ss);
    }
    // de-dup while keeping order
    const uniq = [...new Set(picked)];
    setAutoMultiSizes(uniq);
    // run the thickness-based fill immediately with these sizes
    setTimeout(() => autoMultiSizeFill(uniq), 0);
  };

  // ---- Smart Auto Fill (one click): picks sizes by thickness AND colors by size — a complete, good-looking
  // fill with no manual decisions, using whatever palette is already set in Auto Color. ----
  const smartAutoFill = () => {
    const ps = placedShapeRef.current || placedShape;
    if (!ps || !ps.skeleton || ps.skeleton.length === 0) {
      alert("Pehle ek image trace karke Approve karo, phir Smart Auto Fill dabao.");
      return;
    }
    autoDesign();
    setAutoColorMode("size");
    setTimeout(() => applyAutoColor(), 120); // small delay so the new stones exist before we color them
  };

  // ---- Auto Multi-Size fill: thick strokes get big stones, thin strokes get small ----
  // Mimics professional rhinestone designs (bold outlines + fine detail).
  const autoMultiSizeFill = (overrideSizes) => {
    const ps = placedShapeRef.current || placedShape;
    if (!ps || !ps.skeleton || ps.skeleton.length === 0) {
      alert("Pehle ek image trace karke place karo (skeleton chahiye).");
      return;
    }
    const sizeNames = Array.isArray(overrideSizes) ? overrideSizes : autoMultiSizes;
    const seq = sizeNames.map((ss) => stoneSizes.find((s) => s.ss === ss)).filter(Boolean).sort((a, b) => a.mm - b.mm);
    if (seq.length === 0) { alert("Kam se kam ek size chuno."); return; }
    // biggest size sets spacing so nothing overlaps
    const maxMm = Math.max(...seq.map((s) => s.mm));
    const baseStep = maxMm * PX_PER_MM * (1 + (fillPanel.space || 0));
    const minDist = baseStep * 0.7;
    const cell = baseStep;
    const grid = new Map();
    const out = [];
    const pts = ps.skeleton.map((p) => ({
      x: ps.x + p.x * ps.w,
      y: ps.y + p.y * ps.h,
      t: p.t == null ? 0.5 : p.t,
    }));
    const nearby = (x, y, r) => {
      const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const arr = grid.get((gx + dx) + "," + (gy + dy));
        if (arr) for (const q of arr) if (Math.hypot(q.x - x, q.y - y) < r) return true;
      }
      return false;
    };
    // process thickest points first so bold outlines get placed cleanly
    pts.sort((a, b) => b.t - a.t);
    for (const p of pts) {
      // map thickness (0..1) to a size in the sequence (thin→first, thick→last)
      const zone = Math.min(seq.length - 1, Math.floor(p.t * seq.length));
      const sizeObj = seq[zone];
      const localDist = sizeObj.mm * PX_PER_MM * (1 + (fillPanel.space || 0)) * 0.85;
      if (nearby(p.x, p.y, Math.max(minDist, localDist))) continue;
      const ck = Math.floor(p.x / cell) + "," + Math.floor(p.y / cell);
      if (!grid.has(ck)) grid.set(ck, []);
      grid.get(ck).push(p);
      out.push({ id: nextId(), x: p.x, y: p.y, ss: sizeObj.ss, mm: sizeObj.mm, color: activeColor, pathId: null });
      if (out.length >= MAX_STONES_PER_FILL) break;
    }
    commitFillResult(out);
    if (!liveFill) setPlacedShape(null);
  };

  const runPathFill = () => {
    // Placed image in Centerline mode → single centerline stones (no double outline)
    const activeVectorPath = paths.find((p) => p.id === selectedPathId);
    if (!activeVectorPath && placedShape && placedShape.skeleton && placedFillMode === "centerline") {
      skeletonSingleLineFill();
      return;
    }
    const polys = getBasePolygonsAll();
    if (polys.length === 0) {
      alert("Pehle ek shape do: Shapes tool se ek shape banao, ya image place karo (phir Select tool se chuno).");
      return;
    }
    const step = activeSizeObj.mm * PX_PER_MM * (1 + (fillPanel.space || 0));
    const out = [];
    const pushStone = (p) => out.push({
      id: nextId(), x: p.x, y: p.y, ss: activeSS, mm: activeSizeObj.mm, color: activeColor, pathId: null,
    });

    for (const pts of polys) {
      const n = pts.length;
      if (n < 2) continue;
      // detect sharp corners (interior angle <= cornerAngle threshold)
      const corners = [];
      if (fillPanel.cornerDetect) {
        for (let i = 0; i < n; i++) {
          const ang = vertexAngleDeg(pts[(i - 1 + n) % n], pts[i], pts[(i + 1) % n]);
          if (ang <= fillPanel.cornerAngle) corners.push(i);
        }
      }

      if (corners.length >= 2) {
        for (let c = 0; c < corners.length; c++) {
          const startIdx = corners[c];
          const endIdx = corners[(c + 1) % corners.length];
          const sub = [pts[startIdx]];
          let i = startIdx;
          while (i !== endIdx) { i = (i + 1) % n; sub.push(pts[i]); }
          const segLen = pathLength(sub);
          const cnt = Math.max(1, Math.round(segLen / step));
          const startK = c === 0 ? 0 : 1;
          for (let k = startK; k <= cnt; k++) {
            pushStone(pointAtDistance(sub, (k / cnt) * segLen));
          }
          if (out.length >= MAX_STONES_PER_FILL) break;
        }
      } else {
        const closed = [...pts, pts[0]];
        const total = pathLength(closed);
        const cnt = Math.max(1, Math.floor(total / step));
        for (let k = 0; k < cnt; k++) {
          pushStone(pointAtDistance(closed, k * step));
          if (out.length >= MAX_STONES_PER_FILL) break;
        }
      }
      if (out.length >= MAX_STONES_PER_FILL) break;
    }
    commitFillResult(out);
  };

  // ---- Offset / Outline Fill ----
  // Offsets the outline once (by Contour Spacing, inside/outside) and fills that single
  // outline with stones. Contour Spacing 0 = fill the original outline itself.
  const runOffsetFill = () => {
    const polys = getBasePolygonsAll();
    if (polys.length === 0) {
      alert("Pehle ek shape do: Shapes tool se shape banao, ya image place karke Select karo.");
      return;
    }
    const step = activeSizeObj.mm * PX_PER_MM * (1 + (fillPanel.space || 0));
    const out = [];
    for (const base of polys) {
      const dist = fillPanel.contourSpacing * PX_PER_MM * (fillPanel.side === "outside" ? 1 : -1);
      const outline = Math.abs(dist) < 0.5 ? base : offsetPolygon(base, dist);
      const ringPts = [...outline, outline[0]];
      const total = pathLength(ringPts);
      const cnt = Math.max(1, Math.floor(total / step));
      for (let k = 0; k < cnt; k++) {
        const p = pointAtDistance(ringPts, k * step);
        out.push({ id: nextId(), x: p.x, y: p.y, ss: activeSS, mm: activeSizeObj.mm, color: activeColor, pathId: null });
        if (out.length >= MAX_STONES_PER_FILL) break;
      }
      if (out.length >= MAX_STONES_PER_FILL) break;
    }
    commitFillResult(out);
  };

  // ---- Hatch Fill ----
  // Fills the shape interior with parallel lines at Hatch Angle; stones are placed
  // along those lines with even spacing. Uses even-odd rule so multiple parts / holes work.
  const runHatchFill = () => {
    // For a placed image, hatch the SOLID silhouette (mask) so the angle is clearly visible
    if (placedShape && !paths.find((p) => p.id === selectedPathId)) {
      hatchPlacedImage();
      return;
    }
    const polys = getBasePolygonsAll();
    if (polys.length === 0) {
      alert("Pehle ek shape do: Shapes tool se shape banao, ya image place karke Select karo.");
      return;
    }
    // overall bounding box of all polygons
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    polys.forEach((poly) => poly.forEach((p) => {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }));

    const stoneStep = activeSizeObj.mm * PX_PER_MM * (1 + (fillPanel.space || 0)); // stones along a line
    const lineGap = (fillPanel.fillLinesSpacing > 0 ? fillPanel.fillLinesSpacing : 2.7) * PX_PER_MM; // gap between hatch lines
    const angle = (fillPanel.hatchAngle || 0) * Math.PI / 180;
    const cosA = Math.cos(angle), sinA = Math.sin(angle);

    // rotate a point into hatch-space (so hatch lines become horizontal)
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const toHatch = (x, y) => ({
      u: (x - cx) * cosA + (y - cy) * sinA,
      v: -(x - cx) * sinA + (y - cy) * cosA,
    });
    const fromHatch = (u, v) => ({
      x: cx + u * cosA - v * sinA,
      y: cy + u * sinA + v * cosA,
    });

    // convert all polygons to hatch-space edges
    const edges = [];
    let vMin = Infinity, vMax = -Infinity, uMin = Infinity, uMax = -Infinity;
    polys.forEach((poly) => {
      const hp = poly.map((p) => toHatch(p.x, p.y));
      for (let i = 0; i < hp.length; i++) {
        const a = hp[i], b = hp[(i + 1) % hp.length];
        edges.push([a, b]);
        vMin = Math.min(vMin, a.v); vMax = Math.max(vMax, a.v);
        uMin = Math.min(uMin, a.u); uMax = Math.max(uMax, a.u);
      }
    });

    const out = [];
    // scan horizontal lines (constant v) across the shape in hatch-space
    for (let v = vMin + lineGap / 2; v < vMax; v += lineGap) {
      // find intersections of this scanline with all edges
      const xs = [];
      for (const [a, b] of edges) {
        if ((a.v <= v && b.v > v) || (b.v <= v && a.v > v)) {
          const t = (v - a.v) / (b.v - a.v);
          xs.push(a.u + t * (b.u - a.u));
        }
      }
      xs.sort((p, q) => p - q);
      // fill between pairs of intersections (inside spans)
      for (let i = 0; i + 1 < xs.length; i += 2) {
        const u0 = xs[i], u1 = xs[i + 1];
        for (let u = u0 + stoneStep / 2; u < u1; u += stoneStep) {
          const pt = fromHatch(u, v);
          out.push({ id: nextId(), x: pt.x, y: pt.y, ss: activeSS, mm: activeSizeObj.mm, color: activeColor, pathId: null });
          if (out.length >= MAX_STONES_PER_FILL) break;
        }
        if (out.length >= MAX_STONES_PER_FILL) break;
      }
      if (out.length >= MAX_STONES_PER_FILL) break;
    }
    commitFillResult(out);
  };

  // Hatch a placed image's solid area at the Hatch Angle (samples the mask)
  // ---- Solid Design Fill: outline the border + fill the inside with rows ----
  // For finished/solid rhinestone designs (horse, deer, birds) — not thin line art.
  const solidDesignFill = () => {
    if (!placedShape || !placedShape.dataUrl) {
      alert("Ye solid image par kaam karta hai. Image ko high threshold se trace karo (poora silhouette bhara ho), phir Approve.");
      return;
    }
    recordAction("Solid Design Fill", solidDesignFill);
    const img = new window.Image();
    img.onload = () => {
      const off = document.createElement("canvas");
      off.width = CANVAS_W; off.height = CANVAS_H;
      const octx = off.getContext("2d");
      octx.drawImage(img, placedShape.x, placedShape.y, placedShape.w, placedShape.h);
      const data = octx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;
      const W = CANVAS_W, H = CANVAS_H;
      const isSolid = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? false : data[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 128;
      // is this an edge pixel? (solid pixel touching a non-solid neighbour)
      const isEdge = (x, y) => {
        if (!isSolid(x, y)) return false;
        const r = Math.ceil(activeSizeObj.mm * PX_PER_MM * 0.5);
        return !isSolid(x - r, y) || !isSolid(x + r, y) || !isSolid(x, y - r) || !isSolid(x, y + r);
      };
      const step = activeSizeObj.mm * PX_PER_MM * (1 + (fillPanel.space || 0));

      // Find the silhouette's own bounding box first — the grid below is anchored to THIS
      // (the design/outline's own extent), not the canvas origin, so it always lines up
      // with the artwork itself no matter where it sits on the canvas.
      let minX = W, minY = H, maxX = 0, maxY = 0;
      for (let y = 0; y < H; y += 3) {
        for (let x = 0; x < W; x += 3) {
          if (isSolid(x, y)) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < minX || maxY < minY) { alert("Koi solid area nahi mila. Threshold badhao taaki design bhara dikhe."); return; }

      // ONE unified grid (anchored to the silhouette's own top-left corner) used by BOTH passes below,
      // so an edge stone and an inside stone can never land in the same cell — no more overlap.
      const cell = step;
      const snap = (x, y) => {
        const gx = Math.floor((x - minX) / cell);
        const gy = Math.floor((y - minY) / cell);
        return { x: minX + (gx + 0.5) * cell, y: minY + (gy + 0.5) * cell, key: gx + "," + gy };
      };

      const out = [];
      const occupied = new Set();
      // pass 1: place along edges first (clean, crisp outline)
      for (let y = minY; y <= maxY; y += Math.max(1, step * 0.5)) {
        for (let x = minX; x <= maxX; x += Math.max(1, step * 0.5)) {
          if (!isEdge(x, y)) continue;
          const s = snap(x, y);
          if (occupied.has(s.key)) continue;
          occupied.add(s.key);
          out.push({ id: nextId(), x: s.x, y: s.y, ss: activeSS, mm: activeSizeObj.mm, color: activeColor, pathId: null });
          if (out.length >= MAX_STONES_PER_FILL) break;
        }
        if (out.length >= MAX_STONES_PER_FILL) break;
      }
      // pass 2: fill the inside on the SAME grid (only cells not already used by the edge pass)
      for (let y = minY; y <= maxY && out.length < MAX_STONES_PER_FILL; y += step) {
        for (let x = minX; x <= maxX; x += step) {
          if (!isSolid(x, y)) continue;
          const s = snap(x, y);
          if (occupied.has(s.key)) continue;
          occupied.add(s.key);
          out.push({ id: nextId(), x: s.x, y: s.y, ss: activeSS, mm: activeSizeObj.mm, color: activeColor, pathId: null });
          if (out.length >= MAX_STONES_PER_FILL) break;
        }
      }
      if (out.length === 0) { alert("Koi solid area nahi mila. Threshold badhao taaki design bhara dikhe."); return; }
      commitFillResult(out);
      if (!liveFill) setPlacedShape(null);
    };
    img.src = placedShape.dataUrl;
  };

  // ---- Fill Inside Area (next-step button): after an outline/edge fill is already on canvas, ----
  // this ADDS stones into whatever empty interior remains — it never removes the existing fill.
  // ---- Fill Inside Area (next-step, 3 methods): after an outline fill is already on canvas, these ADD ----
  // stones into whatever empty interior remains — they never remove the existing outline fill.
  const fillInsideArea = (method = "scatter") => {
    if (!placedShape || !placedShape.dataUrl) { alert("Pehle design ko canvas par place karo, phir outline fill karo, phir ye button dabao."); return; }
    const img = new window.Image();
    img.onload = () => {
      const off = document.createElement("canvas");
      off.width = CANVAS_W; off.height = CANVAS_H;
      const octx = off.getContext("2d");
      octx.drawImage(img, placedShape.x, placedShape.y, placedShape.w, placedShape.h);
      const data = octx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;
      const W = CANVAS_W, H = CANVAS_H;
      const isSolid = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? false : data[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 128;

      // silhouette's own bounding box, so the grid lines up with the artwork itself
      let minX = W, minY = H, maxX = 0, maxY = 0;
      for (let y = 0; y < H; y += 3) {
        for (let x = 0; x < W; x += 3) {
          if (isSolid(x, y)) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < minX || maxY < minY) { alert("Koi solid area nahi mila. Threshold badhao taaki design bhara dikhe."); return; }

      const step = activeSizeObj.mm * PX_PER_MM * (1 + (fillPanel.space || 0));
      const minGapToExisting = step * 0.9; // gap maintain karo existing outline stones se
      const existing = stonesRef.current;

      // fast spatial grid for the EXISTING stones (so we don't stack new stones on top of the outline)
      const cellSz = Math.max(1, minGapToExisting);
      const exGrid = new Map();
      existing.forEach((s) => {
        const k = Math.floor(s.x / cellSz) + "," + Math.floor(s.y / cellSz);
        if (!exGrid.has(k)) exGrid.set(k, []);
        exGrid.get(k).push(s);
      });
      const tooCloseToExisting = (x, y) => {
        const cx = Math.floor(x / cellSz), cy = Math.floor(y / cellSz);
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
          const arr = exGrid.get((cx + dx) + "," + (cy + dy));
          if (arr) for (const s of arr) if (Math.hypot(s.x - x, s.y - y) < minGapToExisting) return true;
        }
        return false;
      };

      const out = [];
      const occupied = new Set();
      const tryAdd = (x, y, cellStep) => {
        if (!isSolid(x, y)) return;
        const key = Math.round(x / cellStep) + "," + Math.round(y / cellStep);
        if (occupied.has(key)) return;
        if (tooCloseToExisting(x, y)) return;
        occupied.add(key);
        out.push({ id: nextId(), x, y, ss: activeSS, mm: activeSizeObj.mm, color: activeColor, pathId: null });
      };

      if (method === "scatter") {
        // regular grid — even, predictable spacing
        for (let y = minY; y <= maxY && out.length < MAX_STONES_PER_FILL; y += step) {
          for (let x = minX; x <= maxX; x += step) tryAdd(x, y, step);
        }
      } else if (method === "hatch") {
        // 45° diagonal hatch lines, spaced `step` apart
        const h = maxY - minY, w = maxX - minX;
        const numLines = Math.ceil((w + h) / step) + 2;
        for (let i = 0; i < numLines && out.length < MAX_STONES_PER_FILL; i++) {
          const startX = minX - h + i * step;
          for (let t = 0; t <= h; t += step * 0.95) {
            const y = minY + t, x = startX + t;
            if (x < minX || x > maxX) continue;
            tryAdd(x, y, step);
          }
        }
      } else if (method === "island") {
        // concentric contour rings inward from the outline, spaced `step` apart (uses a distance transform)
        const bw = maxX - minX, bh = maxY - minY;
        const maxDim = 400;
        const scale = Math.min(1, maxDim / Math.max(bw, bh, 1));
        const sw = Math.max(1, Math.round(bw * scale)), sh = Math.max(1, Math.round(bh * scale));
        const g = new Uint8Array(sw * sh);
        for (let y = 0; y < sh; y++) {
          for (let x = 0; x < sw; x++) {
            const fx = minX + Math.min(bw - 1, Math.round(x / scale)), fy = minY + Math.min(bh - 1, Math.round(y / scale));
            g[y * sw + x] = isSolid(fx, fy) ? 1 : 0;
          }
        }
        const INF = 1e6;
        const dist = new Float32Array(sw * sh);
        for (let i = 0; i < sw * sh; i++) dist[i] = g[i] ? INF : 0;
        for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
          const i = y * sw + x; if (dist[i] === 0) continue;
          let d = dist[i];
          if (x > 0) d = Math.min(d, dist[i - 1] + 1);
          if (y > 0) d = Math.min(d, dist[i - sw] + 1);
          if (x > 0 && y > 0) d = Math.min(d, dist[i - sw - 1] + 1.414);
          if (x < sw - 1 && y > 0) d = Math.min(d, dist[i - sw + 1] + 1.414);
          dist[i] = d;
        }
        for (let y = sh - 1; y >= 0; y--) for (let x = sw - 1; x >= 0; x--) {
          const i = y * sw + x; if (dist[i] === 0) continue;
          let d = dist[i];
